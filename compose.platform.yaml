# Optional LOCAL container stack. All published ports bind to loopback.
# Run python scripts/init_env.py first. Not executed in the current environment.
x-env: &environment
  DJANGO_DEBUG: '1'
  POSTGRES_HOST: ''
  REVENUE_POSTGRES_HOST: ''
  MUNICIPAL_POSTGRES_HOST: ''
  ALLOW_LOCAL_HTTP: '1'
  PYTHONPATH: /app
  INTERNAL_HTTP_HOSTS: revenue,municipality,identity
  REVENUE_API_URL: http://revenue:8000
  MUNICIPAL_API_URL: http://municipality:8000
  SSO_ISSUER: http://127.0.0.1:8003
  SSO_BACKCHANNEL_URL: http://identity:8000
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,portal
  REVENUE_ALLOWED_HOSTS: localhost,127.0.0.1,revenue
  MUNICIPAL_ALLOWED_HOSTS: localhost,127.0.0.1,municipality
  IDENTITY_ALLOWED_HOSTS: localhost,127.0.0.1,identity
  SQLITE_PATH: /data/portal.sqlite3
  REVENUE_SQLITE_PATH: /data/revenue.sqlite3
  MUNICIPAL_SQLITE_PATH: /data/municipal.sqlite3
  IDENTITY_SQLITE_PATH: /data/identity.sqlite3
services:
  identity:
    build: .
    env_file: .env
    environment: *environment
    working_dir: /app/identity_service
    command: [sh, -c, 'python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn identity_config.wsgi:application --bind 0.0.0.0:8000 --workers 1']
    ports: [127.0.0.1:8003:8000]
    volumes: [identity-data:/data, './private:/app/private:ro']
  revenue:
    build: .
    env_file: .env
    environment: *environment
    working_dir: /app/revenue_service
    command: [sh, -c, 'python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn revenue_config.wsgi:application --bind 0.0.0.0:8000 --workers 1']
    ports: [127.0.0.1:8001:8000]
    volumes: [revenue-data:/data]
  municipality:
    build: .
    env_file: .env
    environment: *environment
    working_dir: /app/municipal_service
    command: [sh, -c, 'python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn municipal_config.wsgi:application --bind 0.0.0.0:8000 --workers 1']
    ports: [127.0.0.1:8002:8000]
    volumes: [municipal-data:/data]
  portal:
    build: .
    env_file: .env
    environment: *environment
    command: [sh, -c, 'python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1']
    ports: [127.0.0.1:8000:8000]
    volumes: [portal-data:/data]
    depends_on: [identity, revenue, municipality]
  worker:
    build: .
    env_file: .env
    environment: *environment
    command: [sh, -c, 'python manage.py migrate && python manage.py run_exchange_worker']
    volumes: [portal-data:/data]
    depends_on: [portal]
volumes:
  portal-data:
  revenue-data:
  municipal-data:
  identity-data:
