pid /tmp/civicbridge-nginx.pid;
worker_processes 1;
error_log stderr;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/civicbridge-client;
    proxy_temp_path /tmp/civicbridge-proxy;
    fastcgi_temp_path /tmp/civicbridge-fastcgi;
    uwsgi_temp_path /tmp/civicbridge-uwsgi;
    scgi_temp_path /tmp/civicbridge-scgi;

    map $uri $mount_path {
        ~^/revenue/       /revenue;
        ~^/municipality/  /municipality;
        ~^/identity/      /identity;
        default           "";
    }

    map $mount_path $django_server {
        /revenue       127.0.0.1:8001;
        /municipality  127.0.0.1:8002;
        /identity      127.0.0.1:8003;
        default        127.0.0.1:8000;
    }

    server {
        listen PUBLIC_PORT;
        absolute_redirect off;
        server_tokens off;

        location = /revenue { return 308 /revenue/; }
        location = /municipality { return 308 /municipality/; }
        location = /identity { return 308 /identity/; }

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header SCRIPT_NAME $mount_path;
            proxy_set_header PATH_INFO "";
            proxy_pass http://$django_server;
        }
    }
}
