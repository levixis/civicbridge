# Merge with compose.yaml after setting .env for production as described in OPERATIONS.md.
services:
  portal:
    environment:
      DJANGO_DEBUG: '0'
      TRUST_PROXY: '1'
    ports: !reset []
  revenue:
    environment:
      DJANGO_DEBUG: '0'
      TRUST_PROXY: '1'
    ports: !reset []
  worker:
    environment:
      DJANGO_DEBUG: '0'
  proxy:
    image: caddy:2
    ports: ['80:80', '443:443']
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set real portal domain}
      REVENUE_DOMAIN: ${REVENUE_DOMAIN:?Set real revenue domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      portal: {condition: service_healthy}
      revenue: {condition: service_healthy}
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
