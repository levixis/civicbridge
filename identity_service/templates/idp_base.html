{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivicBridge Identity</title><link rel="stylesheet" href="{% static 'style.css' %}"></head><body><div class="demo-strip">LOCAL IDENTITY SERVICE <span>Shared sign-in · departmental permissions remain local</span></div><header><a class="brand" href="/">Civic<span>Identity</span></a><nav>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button">Sign out {{ user.username }}</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a><a href="{% url 'register' %}">Create identity</a>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main></body></html>
